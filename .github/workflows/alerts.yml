name: Revisar alertas de Rumbiva

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_failover:
        description: Comprobar el runner alternativo omitiendo la llamada primaria
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rumbiva-alerts
  cancel-in-progress: false

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      result: ${{ steps.alerts.outputs.result }}
    steps:
      - name: Obtener el procesador de alertas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ejecutar revisiones pendientes
        id: alerts
        continue-on-error: true
        env:
          ALERTS_CRON_SECRET: ${{ secrets.VUELOTEL_ALERTS_CRON }}
          DIAGNOSTIC_FAILOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_failover }}
        run: node scripts/run-alerts.mjs
  fallback:
    needs: primary
    if: ${{ !cancelled() && needs.primary.result == 'success' && needs.primary.outputs.result == 'preconnect_failed' }}
    runs-on: macos-latest
    timeout-minutes: 7
    outputs:
      result: ${{ steps.alerts.outputs.result }}
    steps:
      - name: Obtener el procesador de alertas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ejecutar revisiones desde el runner alternativo
        id: alerts
        env:
          ALERTS_CRON_SECRET: ${{ secrets.VUELOTEL_ALERTS_CRON }}
        run: node scripts/run-alerts.mjs
  verify:
    needs: [primary, fallback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obtener el verificador
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verificar el resultado completo
        env:
          PRIMARY_STATUS: ${{ needs.primary.result }}
          PRIMARY_OUTCOME: ${{ needs.primary.outputs.result }}
          FALLBACK_STATUS: ${{ needs.fallback.result }}
          FALLBACK_OUTCOME: ${{ needs.fallback.outputs.result }}
        run: node scripts/run-alerts.mjs --verify-workflow
